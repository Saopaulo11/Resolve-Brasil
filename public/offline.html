<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Resolve Brasil</title>
    <meta name="theme-color" content="#10243e" />
    <!--
      Стиль только внешним файлом: строгая CSP запрещает встроенные, и такой
      стиль браузер отбрасывает молча. Файл лежит в кэше вместе с этой
      страницей, поэтому без сети она всё равно выглядит как сайт.
    -->
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="icon" href="/images/brand/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="conteudo">
      <section class="section">
        <div class="container container--narrow">
          <h1>Sem conexão</h1>
          <p class="lede">
            Não conseguimos carregar esta página agora. Verifique sua internet
            e tente de novo.
          </p>
          <p>
            Seus casos continuam salvos. Nada do que você escreveu foi perdido
            — quando a conexão voltar, tudo estará onde estava.
          </p>
          <p>
            <a class="btn btn--primary" href="/">Tentar novamente</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
