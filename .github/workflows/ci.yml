name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # postinstall не используется: клиент Prisma генерируется шагом build,
      # чтобы `npm ci` не падал там, где схема ещё не прочитана.
      - run: npm ci

      - run: npm run db:generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Ключей и базы здесь намеренно нет: сборка не должна их требовать.
      # Если этот шаг начнёт падать без них — значит появился код, который
      # читает конфигурацию на уровне модуля вместо вызова loadConfig().
      - run: npm run build
